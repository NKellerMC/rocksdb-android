name: Build RocksDB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone RocksDB
        run: |
          rm -rf rocksdb
          git clone --depth 1 https://github.com/marykdb/rocksdb.git rocksdb
          cd rocksdb
          git submodule update --init --recursive || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;29.0.14206865"

      - name: Verify installation
        run: |
          java -version
          cmake --version || true
          ls -lah "$ANDROID_SDK_ROOT/cmake"
          ls -lah "$ANDROID_SDK_ROOT/ndk"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget tar unzip xz-utils

      - name: Download third-party sources
        shell: bash
        run: |
          set -eux

          chmod +x bz2/downloadBz2.sh
          chmod +x lz4/downloadLz4.sh
          chmod +x snappy/downloadSnappy.sh
          chmod +x zstd/downloadZstd.sh

          ./bz2/downloadBz2.sh 1.0.8 ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
          ./lz4/downloadLz4.sh 1.10.0
          echo "=== Baixando Snappy manualmente ==="

          rm -rf snappy/snappy-1.2.2

          mkdir -p snappy

          curl -L -o snappy.tar.gz https://github.com/google/snappy/archive/refs/tags/1.2.2.tar.gz

          tar -xzf snappy.tar.gz -C snappy

            FOUND=$(find snappy -maxdepth 3 -type d -name "snappy-1.2.2" | head -1)

            if [ "$FOUND" != "snappy/snappy-1.2.2" ]; then
              rm -rf snappy/snappy-1.2.2
              mv "$FOUND" snappy/snappy-1.2.2
            fi

          rm snappy.tar.gz

          ./zstd/downloadZstd.sh 1.5.7 eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3

          echo "=== Verificando ==="

          ls -lah bz2
          ls -lah lz4
          ls -lah snappy
          ls -lah zstd

          
          echo "=== Corrigindo estrutura Snappy ==="

          if [ ! -d snappy/snappy-1.2.2 ]; then
            FOUND=$(find snappy -maxdepth 3 -type d -name "snappy-1.2.2" | head -1 || true)

            if [ -n "$FOUND" ]; then
              mv "$FOUND" snappy/snappy-1.2.2
            else
              echo "Snappy não encontrado após download"
              find snappy -maxdepth 3 -type d
              exit 1
            fi
          fi

          test -d snappy/snappy-1.2.2

      - name: Verify downloaded sources
        run: |
          find bz2 -maxdepth 2
          find lz4 -maxdepth 2
          find snappy -maxdepth 2
          find zstd -maxdepth 2

      - name: Build zstd Android
        run: |
          echo "=== Encontrando zstd raiz ==="

          ZSTD_DIR=$(find . -path "*/zstd-1.5.7/build/cmake/CMakeLists.txt" | head -1 | xargs dirname)

          if [ -z "$ZSTD_DIR" ]; then
            echo "❌ CMake raiz do zstd não encontrado"
            find . -name CMakeLists.txt | grep zstd
            exit 1
          fi

          echo "✅ zstd raiz: $ZSTD_DIR"

          mkdir -p "$ZSTD_DIR/build/android"
          cd "$ZSTD_DIR/build/android"

          cmake ../..             -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-21             -DCMAKE_BUILD_TYPE=Release             -DZSTD_BUILD_PROGRAMS=OFF             -DZSTD_BUILD_TESTS=OFF             -DZSTD_BUILD_SHARED=ON             -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$GITHUB_WORKSPACE/zstd-output

          cmake --build . --config Release

          echo "=== Resultado zstd ==="
          find "$GITHUB_WORKSPACE" -name "libzstd*.so" || true
