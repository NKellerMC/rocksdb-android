name: Build RocksDB Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone RocksDB
        run: |
          rm -rf rocksdb
          git clone --depth 1 https://github.com/marykdb/rocksdb.git rocksdb
          cd rocksdb
          git submodule update --init --recursive || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;29.0.14206865"

      - name: Verify installation
        run: |
          java -version
          cmake --version || true
          ls -lah "$ANDROID_SDK_ROOT/cmake"
          ls -lah "$ANDROID_SDK_ROOT/ndk"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget tar unzip xz-utils

      - name: Download third-party sources
        shell: bash
        run: |
          set -eux

          chmod +x bz2/downloadBz2.sh
          chmod +x lz4/downloadLz4.sh
          chmod +x snappy/downloadSnappy.sh
          chmod +x zstd/downloadZstd.sh

          ./bz2/downloadBz2.sh 1.0.8 ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
          ./lz4/downloadLz4.sh 1.10.0
          ./snappy/downloadSnappy.sh 1.2.2 90f74bc1fbf78a6c56b3c4a082a05103b3a56bb17bca1a27e052ea11723292dc
          ./zstd/downloadZstd.sh 1.5.7 eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3

          echo "=== Verificando ==="

          ls -lah bz2
          ls -lah lz4
          ls -lah snappy
          ls -lah zstd

          test -d snappy/snappy-1.2.1

      - name: Verify downloaded sources
        run: |
          find bz2 -maxdepth 2
          find lz4 -maxdepth 2
          find snappy -maxdepth 2
          find zstd -maxdepth 2

      - name: Build RocksDB Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          ./gradlew \
            clean \
            :library:assembleRelease \
            --stacktrace \
            --info

      - name: List outputs
        if: always()
        run: |
          find . -type f | grep -Ei "\.(aar|so|jar)$" || true

      - name: Upload AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-android-aar
          path: |
            library/build/outputs/aar/*.aar

      - name: Upload Native Libraries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-native-libs
          path: |
            **/*.so

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
            **/*.log
